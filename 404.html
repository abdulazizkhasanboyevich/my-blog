<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sahifa topilmadi — Texnoblog</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var t = localStorage.getItem('blog-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body data-page="404">

  <header class="site-header">
    <div class="container">
      <nav class="nav" aria-label="Main navigation">
        <a href="/" class="nav__logo">Texnoblog</a>

        <ul class="nav__links">
          <li><a href="/" class="nav__link">Home</a></li>
          <li><a href="/blog.html" class="nav__link">Blog</a></li>
          <li><a href="/about.html" class="nav__link">About</a></li>
        </ul>

        <div class="nav__actions">
          <button class="theme-toggle" aria-label="Toggle dark mode">
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="content-narrow" style="text-align: center; padding: 6rem 0;">
      <p style="font-family: var(--font-serif); font-size: 5rem; color: var(--color-accent); line-height: 1; margin-bottom: 1rem;">404</p>
      <h1 style="margin-bottom: 0.75rem;">Sahifa topilmadi</h1>
      <p style="color: var(--color-text-muted); margin-bottom: 2rem;">Siz izlayotgan sahifa mavjud emas yoki ko'chirilgan bo'lishi mumkin.</p>
      <a href="/" class="hero__cta">Bosh sahifaga qaytish</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer__inner">
        <p class="footer__copy">&copy; 2026 Texnoblog. Barcha huquqlar himoyalangan.</p>
        <nav class="footer__links" aria-label="Footer navigation">
          <a href="/">Home</a>
          <a href="/blog.html">Blog</a>
          <a href="/about.html">About</a>
        </nav>
      </div>
    </div>
  </footer>

  <script>
    document.querySelector('.theme-toggle').addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('blog-theme', next);
    });
  </script>
</body>
</html>
